server:
  port: 8080

spring:
  application:
    name: quizclash
  threads:
    virtual:
      enabled: true            # Java 21 virtual threads for request handling
  mvc:
    async:
      request-timeout: 90s     # SSE streams from the chatbot
  servlet:
    multipart:
      max-file-size: 10MB      # uploaded study documents
      max-request-size: 11MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Game state lives in memory, so replaying old answers after a restart
      # would be meaningless. Start from the newest offset.
      auto-offset-reset: latest

  ai:
    openai:
      # A placeholder lets the app boot without a key; the bot then replies
      # with an "offline" message instead of crashing the game.
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7

quizclash:
  question-time-seconds: 20
  questions-per-game: 8
  # Extra time after the deadline before a question is closed, so answers
  # that were submitted in time but are still in flight through Kafka count.
  close-grace-ms: 1000
  topics:
    answers: quiz-answers
    game-events: game-events
    partitions: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.quizclash: INFO
    org.apache.kafka: WARN
